services:
  odysseus:
    environment:
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - CKB_ROOT=/app/ckb
      - FASTEMBED_CACHE_PATH=/app/.cache/huggingface
    volumes:
      - npx-cache:/root/.npm/_npx
      - /root/CKB:/app/ckb:ro

  gdrive-mcp:
    image: node:20-slim
    command: ["npx", "-y", "google-drive-mcp@1.2.1"]
    env_file:
      - .env.gdrive
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

volumes:
  npx-cache:
